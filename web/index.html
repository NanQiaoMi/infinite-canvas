<!doctype html>
<html lang="zh-CN" class="font-sans" style="font-family: var(--font-primary, 'Cascadia Mono', '方正小标宋简体', sans-serif);">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="一个无限画布创作工具" />
        <link rel="icon" href="/logo.svg" />
        <title>无限画布</title>
        <link rel="preload" href="/fonts/CascadiaCode.woff2" as="font" type="font/woff2" crossorigin />
        <link rel="preload" href="/fonts/FZXiaoBiaoSong.woff2" as="font" type="font/woff2" crossorigin />
        <script>
            try {
                var s = JSON.parse(localStorage.getItem("infinite-canvas:theme_store") || "{}");
                var t = s.state && s.state.theme === "light" ? "light" : "dark";
                document.documentElement.classList.toggle("dark", t === "dark");
                document.documentElement.style.colorScheme = t;
            } catch (e) {}
        </script>
    </head>
    <body class="bg-background text-foreground antialiased" style="font-family: var(--font-primary, 'Cascadia Mono', '方正小标宋简体', sans-serif);">
        <div id="root"></div>
        <script src="/config.js"></script>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
