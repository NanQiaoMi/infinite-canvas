services:
  app:
    image: infinite-canvas:server
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: infinite-canvas
    ports:
      - "3002:3000"
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data:/app/data
